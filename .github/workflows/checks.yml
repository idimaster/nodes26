name: checks

# Lint, types, tests, code coverage, and the knowledge-edge coverage floor (V7, gotcha 09)
# against a real Neo4j with APOC and GDS. Coverage reports are uploaded as artifacts.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19
    env:
      NEO4J_URI: neo4j://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: planner-demo
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Recovery tests verify the repository Compose container before any reset.
      - run: docker compose up -d --wait
      - run: npm run mcp:neo4j:install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run load
      - name: Tool surface (skill = agent ⊆ served, write tools guarded; gotcha 03)
        run: npm run check:tools
      - name: Knowledge-edge coverage (V7)
        run: npm run coverage:edges
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: edge-coverage
          path: reports/edge-coverage.json
      - run: npm run coverage
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
      - if: always()
        run: docker compose down --volumes

  publish-badge:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: master
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: coverage-summary
          path: coverage
      - uses: jpb06/coverage-badges-action@6bebba3f008cb03c2be0ff9b148c663df30cde4b # v1.4.11
        with:
          branches: master
          badges-labels-prefix: Repository coverage
          commit-message: 'Update repository coverage badge'
