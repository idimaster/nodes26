<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gate console</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #deded8;
    --accent: #2f6f4f; --warn: #9a5b00; --danger: #a33a3a; --chip: #eef0ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161715; --card: #1f201e; --ink: #ecece8; --muted: #a2a29c; --line: #34352f;
      --accent: #6fbf92; --warn: #e0a54a; --danger: #e27b7b; --chip: #2a2b27;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 20px 16px 8px; max-width: 860px; margin: 0 auto; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; }
  .muted { color: var(--muted); }
  main { max-width: 860px; margin: 0 auto; padding: 8px 16px 40px; display: grid; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
  .gate { font-weight: 600; text-transform: uppercase; letter-spacing: .04em; font-size: 12px; color: var(--accent); }
  ul { margin: 8px 0; padding-left: 18px; }
  li { margin: 4px 0; }
  .alts { color: var(--muted); font-size: 13px; }
  textarea { width: 100%; min-height: 64px; margin: 10px 0 8px; padding: 8px; border-radius: 8px; border: 1px solid var(--line);
             background: var(--bg); color: var(--ink); font: inherit; }
  .hint { font-size: 12px; color: var(--muted); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  button { font: inherit; border-radius: 8px; padding: 7px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  button.approve { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.except { border-color: var(--warn); color: var(--warn); }
  button.reject { border-color: var(--danger); color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  .error { color: var(--danger); font-size: 13px; margin-top: 6px; }
  .empty { text-align: center; padding: 40px 16px; }
  label.by { font-size: 13px; }
  label.by input { font: inherit; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); width: 9em; }
</style>
</head>
<body>
<header>
  <h1>Gate console</h1>
  <span class="muted" id="status">Loading…</span>
  <label class="by">Reviewer <input id="by" value="architect" aria-label="Reviewer name"></label>
</header>
<main id="gates" aria-live="polite"></main>
<script>
  const el = (tag, attrs = {}, ...children) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) k === 'class' ? (n.className = v) : n.setAttribute(k, v);
    for (const c of children) n.append(c);
    return n;
  };
  const drafts = {};

  function card(g) {
    const subjects = el('ul');
    for (const s of g.subjects) {
      const li = el('li', {}, el('strong', {}, s.title), s.fit_score != null ? ` · fit ${s.fit_score}` : '', ` `, el('span', { class: 'muted' }, `(${s.label})`));
      if (s.alternatives && s.alternatives.length) {
        li.append(el('div', { class: 'alts' }, 'Alternatives within 20: ' + s.alternatives.map((a) => `${a.pattern} (${a.fit_score})`).join(', ')));
      }
      subjects.append(li);
    }
    const comment = el('textarea', { 'aria-label': `Comment for ${g.id}`, placeholder: 'Comment (optional). One override per line: remove X · except X · keep X · include X · use bridge for X · directive: …' });
    comment.value = drafts[g.id] ?? '';
    comment.addEventListener('input', () => (drafts[g.id] = comment.value));
    const error = el('div', { class: 'error', role: 'alert' });
    const act = (action) => async () => {
      buttons.forEach((b) => (b.disabled = true));
      error.textContent = '';
      const res = await fetch(`/api/gates/${encodeURIComponent(g.id)}/decision`, {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ action, comment: comment.value, by: document.getElementById('by').value || 'architect' }),
      });
      if (res.ok) { delete drafts[g.id]; refresh(); return; }
      const body = await res.json().catch(() => ({}));
      error.textContent = body.message || `Request failed (${res.status})`;
      buttons.forEach((b) => (b.disabled = false));
    };
    const buttons = [
      el('button', { class: 'approve' }, 'Approve'),
      el('button', { class: 'except' }, 'Approve except…'),
      el('button', { class: 'reject' }, 'Reject'),
    ];
    buttons[0].onclick = act('approve');
    buttons[1].onclick = act('approve_except');
    buttons[2].onclick = act('reject');
    return el('section', { class: 'card', 'aria-label': `Gate ${g.id}` },
      el('div', { class: 'head' }, el('span', { class: 'gate' }, g.gate), el('span', { class: 'chip' }, `${g.deal_code} · iteration ${g.iteration}`), el('span', { class: 'muted' }, g.id)),
      el('div', {}, g.summary),
      subjects,
      comment,
      el('div', { class: 'hint' }, '“Approve except…” needs at least one “except X” line.'),
      el('div', { class: 'actions' }, ...buttons),
      error,
    );
  }

  async function refresh() {
    const status = document.getElementById('status');
    const main = document.getElementById('gates');
    try {
      const gates = await (await fetch('/api/gates?status=pending')).json();
      const focused = document.activeElement && document.activeElement.tagName === 'TEXTAREA';
      if (focused) return; // do not re-render under the reviewer's cursor
      main.replaceChildren(...(gates.length ? gates.map(card) : [el('div', { class: 'card empty muted' }, 'No gates waiting. The agent will appear here when it asks for approval.')]));
      status.textContent = `${gates.length} pending · updated ${new Date().toLocaleTimeString()}`;
    } catch {
      status.textContent = 'Cannot reach the gate server.';
    }
  }
  refresh();
  setInterval(refresh, 2000);
</script>
</body>
</html>
